<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>성찬이의 퀘스트</title>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#262626;--rx:#3a3a3c;--y:#fee500;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:#262626;color:#fff;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}
button{font:inherit;cursor:pointer}
#app{max-width:480px;height:100%;margin:0 auto;position:relative;overflow:hidden}
.scr{display:none;flex-direction:column;height:100%;box-sizing:border-box}
#timer{display:none;position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);right:10px;z-index:20;background:#111;color:#fee500;border:2px solid #fee500;padding:3px 8px;font:16px 'DotGothic16',monospace}
.hd{padding:14px 16px;font-size:18px;font-weight:600;background:#262626;border-bottom:1px solid #333}
#msgs{flex:1;overflow-y:auto;padding:10px 12px}
.row{display:flex;gap:8px;margin-top:3px}.row.f{margin-top:14px}.row.m{justify-content:flex-end}
.av{width:40px;flex:none}.av svg{width:40px;height:40px}.nm{font-size:13px;color:#aaa;margin-bottom:4px}
.bl{display:flex;align-items:flex-end;gap:6px}.row.m .bl{flex-direction:row}
.bb{padding:9px 13px;border-radius:16px;font-size:17px;line-height:1.35;max-width:62vw;word-break:keep-all;overflow-wrap:anywhere}
.row.s .bb{background:var(--rx);border-top-left-radius:2px}.row.m .bb{background:var(--y);color:#111;border-top-right-radius:2px}
.tm{font-size:11px;color:#999;white-space:nowrap}.tm b{color:var(--y);margin-right:4px}
.im .bb{padding:0;background:none!important}.im img{display:block;width:190px;border-radius:12px}.th{width:64px!important;image-rendering:pixelated}
#ch{padding:10px 12px 14px;display:flex;flex-direction:column;gap:8px;min-height:10px}
#ch button{background:#333;color:#fff;border:1px solid #555;border-radius:12px;padding:12px;font-size:16px}
.px,.px #ch button,.px .bb,.px .hd{font-family:'DotGothic16',monospace}
.px #msgs{background:#1b1b2e}.px .hd{background:#111;border-bottom:3px solid #fee500}
.px .bb{border-radius:0!important;border:3px solid #000;box-shadow:3px 3px 0 #000}.px .im img{border-radius:0;border:3px solid #000;image-rendering:pixelated}
.px #ch{background:#111}.px #ch button{border-radius:0;border:3px solid #fee500;background:#1b1b2e}
canvas.pc{width:100%;max-width:440px;image-rendering:pixelated;border:4px solid #fff;box-sizing:border-box;align-self:center;touch-action:manipulation}
.G{font-family:'DotGothic16',monospace;align-items:center;padding:56px 12px 12px;background:#15152a;overflow-y:auto}
.pb{background:#fee500;color:#111;border:4px solid #fff;padding:12px 22px;font:18px 'DotGothic16',monospace;margin-top:14px;box-shadow:4px 4px 0 #000}
.hint{font-size:16px;margin:12px 0 0;text-align:center;min-height:22px}
.sh{animation:sh .3s}@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
#ov{display:none;position:absolute;inset:0;background:#000d;z-index:30;align-items:center;justify-content:center;padding:20px;font-family:'DotGothic16',monospace}
.cd{background:#1b1b2e;border:4px solid #fee500;padding:24px;text-align:center;box-shadow:6px 6px 0 #000}.cd h2{color:#fee500;margin:0 0 12px;font-size:26px}.cd p{font-size:17px;line-height:1.5;margin:0}
.ah{background:#2ac1bc;color:#000;width:100%;padding:12px;font-size:20px;box-sizing:border-box;border:4px solid #fff;text-align:center;margin-bottom:12px}
.fc{display:flex;gap:12px;align-items:center;width:100%;box-sizing:border-box;border:4px solid #fff;background:#242444;padding:10px;margin-bottom:10px;font-size:17px;cursor:pointer;box-shadow:4px 4px 0 #000}
.fc canvas{width:64px;height:64px;image-rendering:pixelated;background:#fff3d0;border:3px solid #000}
.bar{width:100%;height:22px;border:4px solid #fff;box-sizing:border-box;margin-top:16px}.bar i{display:block;height:100%;background:#2ac1bc;width:0;transition:width 3.4s steps(14)}
.ph{width:230px;border:6px solid #eee;background:#000;padding:30px 12px;margin-top:20px;box-shadow:6px 6px 0 #000}.nt{background:#fee500;color:#111;padding:12px;border:3px solid #fff;font-size:16px;line-height:1.4;cursor:pointer;animation:bn .6s infinite}
@keyframes bn{50%{transform:translateY(-5px)}}
.hall{position:relative;width:100%;height:300px;margin-top:40px;background:linear-gradient(#3b3a6b 70%,#a8703a 70%);border:4px solid #fff;box-sizing:border-box;overflow:hidden}
.door{position:absolute;right:30px;bottom:30%;width:90px;height:160px;background:#b8793a;border:6px solid #5b3a1e;box-sizing:border-box}.door:after{content:'';position:absolute;right:10px;top:70px;width:10px;height:10px;background:#ffd23f}
#sp{position:absolute;left:-90px;bottom:26%;width:84px;transition:left 1.3s steps(10);image-rendering:pixelated;animation:jp .25s infinite steps(2)}@keyframes jp{50%{margin-bottom:12px}}
.wd{position:absolute;left:50%;transform:translateX(-50%);background:#fff;color:#111;border:3px solid #000;padding:8px 12px;font-size:20px;white-space:nowrap;animation:fl 2s infinite steps(6);top:20px;box-shadow:3px 3px 0 #000}@keyframes fl{50%{top:10px}}
.pk{display:flex;gap:10px;margin:10px 0}.pk canvas{width:64px;height:64px;image-rendering:pixelated;border:4px solid #555;cursor:pointer}.pk canvas.on{border-color:#fee500}
#end input,#end textarea{width:100%;box-sizing:border-box;background:#0d0d1c;color:#fff;border:3px solid #fff;padding:10px;font:16px 'DotGothic16',monospace;margin-top:8px}
.ci{display:flex;gap:10px;border:3px solid #fff;background:#242444;padding:8px;margin-top:8px}.ci canvas{width:48px;height:48px;flex:none;image-rendering:pixelated}.ci b{color:#fee500}.ci div{word-break:break-word;font-size:15px}
.px .im img.ph{image-rendering:auto}
.fx{background:#fff;color:#111;width:100%;max-width:440px;box-sizing:border-box;padding:14px 14px 0;border:4px solid #fff;margin-top:14px;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}.fg{margin-bottom:14px}.fr{display:flex;gap:8px;margin-top:4px}.fa{width:40px;flex:none}.fa svg{width:40px;height:40px}.fn{font-size:13px;color:#555;margin-bottom:3px}.fl{display:flex;align-items:flex-end;gap:6px}.fb{background:#f1f1f1;padding:9px 13px;border-radius:16px;font-size:16px;line-height:1.35;word-break:keep-all}.fl span{font-size:11px;color:#999;white-space:nowrap}
</style></head><body><div id="app"><div id="timer">0.0초</div>
<section id="chat" class="scr"><div class="hd">성찬이</div><div id="msgs"></div><div id="ch"></div></section>

<section id="g2" class="scr G"></section>
<section id="g3" class="scr G"><canvas id="c3" class="pc" width="160" height="200"></canvas><div class="hint" id="h3"></div><button class="pb" id="shot3" style="display:none">인증샷 찍기</button></section>
